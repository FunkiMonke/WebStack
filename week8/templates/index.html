<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe</title>
</head>
<body>
    <h1>Recipetimebaby</h1>
    <ul>
        {% for recipe in recipes %}

            </li>
        {% endfor %}
    </ul>
</body>
</html>
